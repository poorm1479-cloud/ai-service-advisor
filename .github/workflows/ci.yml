name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asa
          POSTGRES_PASSWORD: asa
          POSTGRES_DB: ai_service_advisor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asa -d ai_service_advisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://asa:asa@localhost:5432/ai_service_advisor
      DATABASE_URL_SYNC: postgresql+psycopg://asa:asa@localhost:5432/ai_service_advisor
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-min-32-characters-long!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migrate database
        run: alembic upgrade head
      - name: Pytest
        run: python -m pytest -q --tb=short
      - name: Import app + health routes
        run: |
          python - <<'PY'
          from app.main import app
          paths = {getattr(r, "path", "") for r in app.routes}
          assert "/health" in paths
          assert "/live" in paths
          assert "/ready" in paths
          assert "/metrics" in paths
          assert "/v1/enterprise/sso/callback" in paths
          assert "/v1/enterprise/sso/begin" in paths
          assert "/v1/enterprise/sso/status" in paths
          print("ok", len(paths), "routes")
          PY

  saas-smoke:
    name: SaaS smoke (API)
    runs-on: ubuntu-latest
    needs: [api-tests]
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asa
          POSTGRES_PASSWORD: asa
          POSTGRES_DB: ai_service_advisor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asa -d ai_service_advisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://asa:asa@localhost:5432/ai_service_advisor
      DATABASE_URL_SYNC: postgresql+psycopg://asa:asa@localhost:5432/ai_service_advisor
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-min-32-characters-long!!
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migrate database
        run: alembic upgrade head
      - name: Start API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/live" >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "API failed to become live" >&2
          exit 1
      - name: Smoke checks
        working-directory: .
        run: python scripts/saas_smoke.py --api-only

  web-lint-build:
    name: Web lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint:web
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build:web

  docker-build:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: false
          tags: asa-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
          tags: asa-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://localhost/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
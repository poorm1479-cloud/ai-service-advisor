{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "asa.fullname" . }}-secrets
type: Opaque
stringData:
  # Replace via --set-file / sealed-secrets / external-secrets in real deploys.
  DATABASE_URL: postgresql+asyncpg://asa:asa@postgres:5432/ai_service_advisor
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: change-me-in-production-min-32-chars!!
  ENVIRONMENT: production
  READY_REQUIRE_REDIS: {{ .Values.env.READY_REQUIRE_REDIS | quote }}
{{- end }}

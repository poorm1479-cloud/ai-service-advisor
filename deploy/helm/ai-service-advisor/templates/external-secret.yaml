{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "asa.fullname" . }}-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "asa.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: REDIS_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: JWT_SECRET
    - secretKey: ENVIRONMENT
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: ENVIRONMENT
    - secretKey: READY_REQUIRE_REDIS
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: READY_REQUIRE_REDIS
{{- end }}

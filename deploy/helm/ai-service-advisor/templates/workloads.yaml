apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asa.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "asa.name" . }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "asa.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "asa.name" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ .Values.image.api | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.apiPort }}
          envFrom:
            - secretRef:
                name: {{ include "asa.fullname" . }}-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.apiPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.service.apiPort }}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
{{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "asa.fullname" . }}-api
spec:
  selector:
    app.kubernetes.io/name: {{ include "asa.name" . }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: {{ .Values.service.apiPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asa.fullname" . }}-web
  labels:
    app.kubernetes.io/name: {{ include "asa.name" . }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "asa.name" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "asa.name" . }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ .Values.image.web | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.webPort }}
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.env.NEXT_PUBLIC_API_URL | quote }}
          resources:
{{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "asa.fullname" . }}-web
spec:
  selector:
    app.kubernetes.io/name: {{ include "asa.name" . }}
    app.kubernetes.io/component: web
  ports:
    - port: {{ .Values.service.webPort }}
      targetPort: {{ .Values.service.webPort }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "asa.fullname" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "asa.fullname" . }}-api
                port:
                  number: {{ .Values.service.apiPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "asa.fullname" . }}-web
                port:
                  number: {{ .Values.service.webPort }}
{{- end }}

# Example SealedSecret (Bitnami) — encrypt with kubeseal before commit.
# Do NOT commit plaintext production secrets.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: asa-secrets-example
  namespace: default
spec:
  encryptedData:
    DATABASE_URL: AgAAAAEXAMPLE_REPLACE_WITH_KUBESEAL_OUTPUT
    REDIS_URL: AgAAAAEXAMPLE_REPLACE_WITH_KUBESEAL_OUTPUT
    JWT_SECRET: AgAAAAEXAMPLE_REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: asa-secrets-example
    type: Opaque

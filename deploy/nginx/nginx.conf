# ASA reverse proxy — HTTPS termination, security headers, upstream routing
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 32m;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=web_limit:10m rate=50r/s;

  upstream api_upstream {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream web_upstream {
    least_conn;
    server web:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
  }

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    location = /nginx-health {
      add_header Content-Type text/plain;
      return 200 'ok';
    }
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:;" always;

    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }

    location /metrics {
      # Restrict metrics to internal networks in hardened deploys
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 127.0.0.1;
      deny all;
      proxy_pass http://api_upstream/metrics;
    }

    location /live {
      proxy_pass http://api_upstream/live;
    }

    location /ready {
      proxy_pass http://api_upstream/ready;
    }

    location /health {
      proxy_pass http://api_upstream/health;
    }

    location / {
      limit_req zone=web_limit burst=100 nodelay;
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
